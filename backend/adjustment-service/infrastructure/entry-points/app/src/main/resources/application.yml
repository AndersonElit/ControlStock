spring:
  application:
    name: adjustment-service
  config:
    import: "optional:vault://controlstock/${APP_ENV:dev}/adjustment-service"
  cloud:
    vault:
      uri: ${VAULT_ADDR:http://vault.secrets.svc.cluster.local:8200}
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: secret
  r2dbc:
    url: ${R2DBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
server:
  port: ${SERVER_PORT:8084}
management:
  endpoints:
    web:
      exposure:
        include: health,readiness,liveness,prometheus,info,metrics
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${APP_ENV:dev}
