spring:
  application:
    name: iam-service
  config:
    import: "optional:vault://controlstock/${APP_ENV:dev}/iam-service"
  cloud:
    vault:
      uri: ${VAULT_ADDR:http://vault.secrets.svc.cluster.local:8200}
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: secret
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/controlstock_iam}
    username: ${DB_USERNAME:controlstock_iam}
    password: ${DB_PASSWORD:changeme_iam}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/controlstock/protocol/openid-connect/certs}
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/controlstock}

keycloak:
  server-url: ${KEYCLOAK_URL:http://localhost:8180}
  realm: controlstock
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
  admin-client-secret: ${KEYCLOAK_ADMIN_SECRET:}

server:
  port: ${SERVER_PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,readiness,liveness,prometheus,info,metrics
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${APP_ENV:dev}
