apiVersion: configuration.konghq.com/v1
kind: KongIngress
metadata:
  name: {{ .Chart.Name }}-kong-config
upstream:
  healthchecks:
    active:
      http_path: /actuator/health/readiness
      healthy:
        interval: 15
        successes: 1
      unhealthy:
        interval: 5
        http_failures: 2
proxy:
  connect_timeout: 5000
  read_timeout: 60000
  write_timeout: 60000
  retries: 3
route:
  strip_path: false
  preserve_host: true
